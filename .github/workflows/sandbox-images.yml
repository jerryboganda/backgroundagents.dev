name: Sandbox Images

on:
  pull_request:
    paths:
      - "packages/sandbox-images/**"
      - "packages/sandbox-runtime/**"
      - "packages/*-infra/**"
      - "packages/vps-executor/**"
      - "terraform/modules/*/scripts/**"
      - "package-lock.json"
      - ".github/workflows/sandbox-images.yml"
      - ".nvmrc"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: e2b
            base: python:3.12-slim-bookworm
          - provider: vercel
            base: amazonlinux:2023
          # Dockerfile.vps pins its own base (targets.json vps.base), so the VPS entry has no base.
          - provider: vps
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.7"
      - name: Check frozen image inputs and planner regressions
        run: |
          python3 packages/sandbox-images/cli.py lock --check
          uv run --frozen --project packages/sandbox-images --extra dev pytest packages/sandbox-images/tests
      - name: Build and verify the reference image on native amd64
        if: matrix.provider != 'vps'
        run: |
          bundle=$(python3 packages/sandbox-images/cli.py pack --provider ${{ matrix.provider }})
          docker build --platform linux/amd64 --build-arg BASE_IMAGE=${{ matrix.base }} -f packages/sandbox-images/Dockerfile -t openinspect-image-contract "$bundle"
          docker run --rm --platform linux/amd64 openinspect-image-contract
      - name: Build and verify the VPS image on native amd64
        if: matrix.provider == 'vps'
        run: |
          set -euo pipefail
          image=openinspect-vps-runtime
          bundle=$(python3 packages/sandbox-images/cli.py pack --provider vps)
          docker build --platform linux/amd64 --pull=false -f packages/sandbox-images/Dockerfile.vps -t "$image" "$bundle"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = 1000:1000
          docker run --rm --platform linux/amd64 --entrypoint sh "$image" -c 'test "$(id -u):$(id -g)" = 1000:1000 && test "$(id -un)" = sandbox'
          docker run --rm --platform linux/amd64 --entrypoint /opt/openinspect/python/bin/python "$image" /app/verify/smoke_test.py verify
          # Empty bind-mounted HOME and workspace on a read-only root with production's /tmp tmpfs. A file already in
          # HOME must survive both runs; running twice over the same binds also checks that seeding is idempotent.
          home_dir="$RUNNER_TEMP/vps-home"
          workspace_dir="$RUNNER_TEMP/vps-workspace"
          sudo install -d -o 1000 -g 1000 -m 0755 "$home_dir" "$workspace_dir"
          docker run --rm --platform linux/amd64 --mount type=bind,source="$home_dir",target=/home/sandbox --entrypoint sh "$image" -c 'mkdir -p /home/sandbox/.agent-browser && printf "%s\n" user-owned > /home/sandbox/.agent-browser/config.json'
          # The contract runs take their tmpfs values from docker.ts, the flags production passes with cap-drop ALL and
          # no-new-privileges, so the CI contract cannot drift from the executor.
          tmp_tmpfs=$(sed -n 's/^const TMP_TMPFS = "\(.*\)";$/\1/p' packages/vps-executor/src/docker.ts)
          x11_tmpfs=$(sed -n 's/^const X11_SOCKET_TMPFS = "\(.*\)";$/\1/p' packages/vps-executor/src/docker.ts)
          test -n "$tmp_tmpfs" && test -n "$x11_tmpfs"
          production_flags=(--read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs "$tmp_tmpfs" --tmpfs "$x11_tmpfs")
          for run in first second; do
            docker run --rm --platform linux/amd64 "${production_flags[@]}" \
              --mount type=bind,source="$home_dir",target=/home/sandbox \
              --mount type=bind,source="$workspace_dir",target=/workspace \
              "$image" /opt/openinspect/python/bin/python /app/verify/smoke_test.py contract
            test "$(cat "$home_dir/.agent-browser/config.json")" = user-owned
          done
          sudo rm -rf "$home_dir" "$workspace_dir"
