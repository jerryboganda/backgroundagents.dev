name: PolytronX overlay allowlist contract

on:
  pull_request:
    paths:
      - ".github/workflows/polytronx-openinspect.yml"
      - ".github/workflows/polytronx-overlay-contract.yml"
      - "deploy/polytronx/overlay-allowlist.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewed-paths:
    name: Allow reviewed paths; deny secrets and unreviewed files
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute release allowlist contracts
        run: node --test deploy/polytronx/overlay-allowlist.test.mjs
